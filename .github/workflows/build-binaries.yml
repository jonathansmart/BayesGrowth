name: Build Pre-Compiled Package Binaries

on:
  push:
    branches:
      - back-calculation

jobs:
  build-binaries:
    name: Build binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up R tools & dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools

      - name: Build Binary Package
        shell: Rscript {0}
        run: |
          # Build pre-compiled binary (.zip for Windows, .tgz for macOS)
          binary_path <- devtools::build(binary = TRUE, args = c('--no-build-vignettes'))
          message("Built binary at: ", binary_path)

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip\n*.tgz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
